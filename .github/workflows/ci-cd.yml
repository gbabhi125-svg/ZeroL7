name: ZeroL7 CI/CD

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build, vet, unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      - name: go test (race detector)
        run: go test -race -count=1 ./...

  docker-build:
    name: Build container images
    runs-on: ubuntu-latest
    needs: build-and-test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build proxy image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile
          push: false
          tags: zerol7-proxy:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build mock backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: Dockerfile.mockbackend
          push: false
          tags: zerol7-mockbackend:ci
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Save images for downstream job
        run: |
          docker save zerol7-proxy:ci zerol7-mockbackend:ci -o /tmp/zerol7-images.tar

      - uses: actions/upload-artifact@v4
        with:
          name: zerol7-images
          path: /tmp/zerol7-images.tar
          retention-days: 1

  load-and-security-test:
    name: k6 load test + simulated attack verification
    runs-on: ubuntu-latest
    needs: docker-build
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: zerol7-images
          path: /tmp

      - name: Load images
        run: docker load -i /tmp/zerol7-images.tar

      - name: Start proxy + mock backend
        run: |
          docker network create zerol7-ci
          docker run -d --name backend-a --network zerol7-ci \
            -e BACKEND_NAME=backend-a -e LISTEN_ADDR=:8080 zerol7-mockbackend:ci
          docker run -d --name zerol7 --network zerol7-ci \
            -p 8080:8080 -p 9090:9090 \
            -v ${{ github.workspace }}/config/config.ci.yaml:/app/config/config.yaml:ro \
            zerol7-proxy:ci

      - name: Wait for proxy readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:9090/healthz; then exit 0; fi
            sleep 1
          done
          echo "proxy did not become healthy in time" >&2
          docker logs zerol7
          exit 1

      - name: Verify malicious payloads are blocked (pre-load-test gate)
        run: |
          set -e
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/search?q=1%27%20OR%20%271%27%3D%271")
          test "$code" = "403"
          code=$(curl -s -o /dev/null -w '%{http_code}' "http://localhost:8080/c?q=%3Cscript%3Ealert(1)%3C/script%3E")
          test "$code" = "403"
          echo "WAF correctly blocked simulated SQLi and XSS payloads"

      - name: Install k6
        run: |
          curl -sSL https://github.com/grafana/k6/releases/download/v0.52.0/k6-v0.52.0-linux-amd64.tar.gz -o k6.tar.gz
          tar -xzf k6.tar.gz
          sudo mv k6-v0.52.0-linux-amd64/k6 /usr/local/bin/k6

      - name: Run k6 load + attack-simulation test
        run: k6 run -e BASE_URL=http://localhost:8080 tests/load_test.js

      - name: Dump proxy logs on failure
        if: failure()
        run: docker logs zerol7

  terraform-plan:
    name: Terraform fmt/validate (declarative infra check)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"

      - name: terraform fmt -check
        run: terraform -chdir=terraform fmt -check -recursive

      - name: terraform init (no backend, validate only)
        run: terraform -chdir=terraform init -backend=false

      - name: terraform validate
        run: terraform -chdir=terraform validate
